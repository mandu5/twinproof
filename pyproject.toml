[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinproof"
version = "0.2.0"
description = "Strict state comparison, witnessed trace equivalence and reproducible oracle audits"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/mandu5/twinproof"

[project.scripts]
twinproof = "twinproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twinproof = ["sources.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
