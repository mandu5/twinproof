name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python scripts/fetch_sources.py
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - run: twinproof trace examples/trace/reference.json examples/trace/candidate.json examples/trace/contract.json
      - run: |
          set +e
          twinproof trace examples/trace/reference.json examples/trace/corrupt.json examples/trace/contract.json
          result=$?
          test "$result" -eq 1
      - run: |
          twinproof audit --snapshot .cache/envsimbench --output .cache/ci-audit
          python scripts/check_audit_receipt.py .cache/ci-audit/summary.json
      - if: matrix.python == '3.11'
        run: |
          python scripts/fetch_clawforge.py
          python scripts/run_runtime_pilot.py --snapshot .cache/clawforge --output .cache/ci-runtime
          python scripts/check_runtime_receipt.py .cache/ci-runtime/summary.json
